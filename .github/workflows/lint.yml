name: Lint

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt QML tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools qml6-module-qtquick

      - name: qmllint
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          qmllint --unresolved-type info \
            $(find package/contents/ui hyprland -name '*.qml') shell.qml

      - name: shared-core unit tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          export PATH="/usr/lib/qt6/bin:$PATH"
          qml tests/run-tests.qml
          qml tests/engine-smoke.qml

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: metadata.json is valid JSON and declares the tray keys
        run: |
          python3 - <<'PY'
          import json, sys
          m = json.load(open("package/metadata.json"))
          assert m["KPlugin"]["Id"] == "org.muddyblack.gitpulse", "plugin id drifted"
          assert m["X-Plasma-NotificationArea"] == "true", "widget would not appear in the System Tray"
          assert m["X-Plasma-NotificationAreaCategory"] == "ApplicationStatus"
          print("metadata ok, version", m["KPlugin"]["Version"])
          PY
