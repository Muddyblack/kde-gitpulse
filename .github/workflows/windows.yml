name: Windows

on:
  pull_request:
    paths:
      - 'windows/**'
      - 'hyprland/**'
      - 'package/**'
      - 'tests/Fixtures.js'
      - 'tests/windows/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
      - master
    paths:
      - 'windows/**'
      - 'hyprland/**'
      - 'package/**'
      - 'tests/Fixtures.js'
      - 'tests/windows/**'
      - '.github/workflows/windows.yml'
      - '.github/workflows/release.yml'
  # A build from any branch by hand: Actions → Windows → Run workflow.
  workflow_dispatch: {}
  workflow_call:
    inputs:
      version:
        description: The release's version (a leading "v" is dropped); names the files and the installer
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      # The app's range, not the build's pins: the newest PySide6 is tried
      # here before a bump of windows/build-requirements.txt ships it.
      - name: install
        run: python -m pip install -r windows/requirements.txt

      - name: settings and distribution tests
        run: python -m unittest discover -s tests/windows -v

      - name: popup loads
        run: python windows/app.py --selftest


  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: version
        shell: pwsh
        env:
          # Through the environment rather than spliced into the script.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:INPUT_VERSION".TrimStart("v")
          if (-not $version) { $version = "0.0.0-ci" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: build
        run: |
          python -m pip install -r windows/build-requirements.txt
          pyinstaller --noconfirm windows/gitpulse.spec

      - name: bundled app loads
        shell: pwsh
        # The selftest takes seconds; a hang (a modal error dialog nobody can
        # click) should fail fast rather than sit out the six-hour job limit.
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/GitPulse/GitPulse.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path "dist/GitPulse" -DestinationPath "gitpulse-windows-$env:VERSION.zip"

      - name: installer
        shell: pwsh
        run: windows/build-installer.ps1 -Version $env:VERSION

      - name: Package manager manifests (stable releases)
        if: inputs.version != '' && !contains(inputs.version, '-')
        shell: pwsh
        run: python windows/package-manifests.py --version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: gitpulse-windows
          path: |
            gitpulse-windows-*.zip
            GitPulse-Setup-*.exe
            dist/package-manifests/gitpulse.json
            dist/package-manifests/gitpulse-winget-*.zip
          if-no-files-found: error
          # A release has its own copy attached; this one is for trying a build.
          retention-days: 14
